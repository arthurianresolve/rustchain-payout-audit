name: Reproductions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m unittest -v
      - run: python prepare_source.py
      - run: python reproduce_duplicate_review_claim.py
      - run: python reproduce_backfill_starvation.py
